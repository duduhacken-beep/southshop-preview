<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando para o pagamento — South Shop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap');

:root{
  --bg:#000000;
  --panel:#0d1220;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.16);
  --blue:#3a5fb0;
  --blue-2:#7b9de0;
  --white:#f4f6f9;
  --muted:#8891a1;
  --muted-2:#5f6980;
  --hex-tile:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyOCIgaGVpZ2h0PSI0NiIgdmlld0JveD0iMCAwIDI4IDQ2Ij4KPGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTYyMjNjIiBzdHJva2Utd2lkdGg9IjEiIG9wYWNpdHk9IjAuNTUiPgo8cGF0aCBkPSJNMTQgMSBMMjcgOC41IEwyNyAyMyBMMTQgMzAuNSBMMSAyMyBMMSA4LjUgWiIvPgo8cGF0aCBkPSJNMCAyNC41IEwxMyAzMiBMMTMgNDYuNSBMMCA1NCBNMjggMjQuNSBMMTUgMzIgTDE1IDQ2LjUgTDI4IDU0Ii8+CjwvZz4KPC9zdmc+');
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background-color:var(--bg);
  background-image:var(--hex-tile);
  background-size:28px 46px;
  background-attachment:fixed;
  color:var(--white);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Barlow',system-ui,sans-serif;}
a{color:inherit;text-decoration:none;}

header{padding:26px 0;border-bottom:1px solid var(--line);}
.logo-link{display:flex;justify-content:center;}
.logo-img{height:38px;width:auto;}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{width:100%;max-width:440px;text-align:center;}

.spinner{
  width:52px;height:52px;margin:0 auto 30px;
  border-radius:50%;
  border:2px solid var(--line-2);
  border-top-color:var(--blue);
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.card .eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue-2);margin-bottom:14px;}
.card h1{font-family:'Barlow',system-ui,sans-serif;font-weight:600;font-size:26px;margin-bottom:14px;line-height:1.3;}
.card p{color:var(--muted);font-size:14.5px;line-height:1.65;margin-bottom:28px;}

.summary{
  border:1px solid var(--line);border-radius:3px;background:var(--panel);
  padding:20px 24px;margin-bottom:22px;text-align:left;
}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--line);}
.summary-row:last-child{border-bottom:none;}
.summary-row.total{color:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:16px;padding-top:14px;}
.summary-row.total b{color:var(--blue-2);font-size:19px;}

.secure-note{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted-2);margin-top:8px;}
.secure-note svg{width:13px;height:13px;stroke:var(--muted-2);fill:none;stroke-width:1.8;}

.progress-track{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:26px;}
.progress-fill{height:100%;background:var(--blue);width:0%;transition:width 2.6s linear;}

/* ================= SEARCH OVERLAY ================= */
.search-overlay{position:fixed;inset:0;background:rgba(2,4,8,.75);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:98;}
.search-overlay.open{opacity:1;pointer-events:auto;}
.search-panel{position:fixed;top:0;left:0;right:0;background:#04070d;border-bottom:1px solid var(--line);padding:100px 24px 40px;transform:translateY(-100%);transition:transform .35s cubic-bezier(.22,.8,.24,1);z-index:99;}
.search-panel.open{transform:translateY(0);}
.search-panel-inner{max-width:640px;margin:0 auto;}
.search-input-row{display:flex;align-items:center;border-bottom:1.5px solid var(--line-2);padding-bottom:14px;gap:14px;}
.search-input-row svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.6;flex-shrink:0;}
.search-input-row input{flex:1;background:transparent;border:none;color:var(--white);font-family:'Cormorant Garamond',serif;font-size:26px;}
.search-input-row input:focus{outline:none;}
.search-input-row input::placeholder{color:var(--muted-2);}
.search-close-btn{background:none;border:none;color:var(--white);font-size:24px;cursor:pointer;line-height:1;padding:0;}
.search-suggest{margin-top:22px;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase;}
.search-suggest-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.search-suggest-chip{border:1px solid var(--line-2);padding:8px 16px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;transition:.15s;background:transparent;}
.search-suggest-chip:hover{border-color:var(--blue-2);color:var(--white);}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <img class="logo-img" id="logoImg" src="assets/img/logo.png" alt="South Car Exclusive · CarPro">
  </a>
</header>

<main>
  <div class="card">
    <div class="spinner"></div>
    <div class="eyebrow">Finalizando pedido</div>
    <h1 class="serif">Você será redirecionado para o pagamento</h1>
    <p>Estamos te levando para o ambiente seguro de pagamento — Pix, cartão ou boleto, processado com a mesma segurança de sempre.</p>

    <div class="summary" id="summaryBox"></div>

    <div class="secure-note">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Pagamento processado com segurança
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</main>

<script>
function fmtBRL(n){ return 'R$ ' + n.toFixed(2).replace('.',','); }

const params = new URLSearchParams(window.location.search);
let cart = [];
try{ cart = JSON.parse(decodeURIComponent(params.get('cart') || '[]')); }catch(e){ cart = []; }

const subtotal = cart.reduce((s,i)=>s + (i.price*i.qty), 0);
const totalQty = cart.reduce((s,i)=>s + i.qty, 0);

document.getElementById('summaryBox').innerHTML = `
  <div class="summary-row"><span>${totalQty} ${totalQty===1?'item':'itens'}</span><span>${fmtBRL(subtotal)}</span></div>
  <div class="summary-row"><span>Frete</span><span>Calculado no pagamento</span></div>
  <div class="summary-row total"><span>Total</span><b>${fmtBRL(subtotal)}</b></div>
`;

setTimeout(()=>{ document.getElementById('progressFill').style.width = '100%'; }, 100);

setTimeout(()=>{
  const orderId = 'SC' + Math.floor(100000 + Math.random()*900000);
  window.location.href = 'obrigado.html?order=' + orderId + '&cart=' + encodeURIComponent(JSON.stringify(cart));
}, 2800);
</script>
</body>
</html>
