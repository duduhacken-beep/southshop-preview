<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Garagem South | South Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: palco 3D à esquerda (carro + pontos clicáveis), painel de vidro à direita com camadas e orçamento; no celular empilha. Tema único escuro (identidade South travada). */
:root {
  color-scheme: dark;
  --bg: #000000;
  --band: #0f1d3a;
  --panel: rgba(13, 18, 32, .78);
  --line: rgba(244, 246, 249, .09);
  --white: #f4f6f9;
  --muted: #8891a1;
  --south: #3a5fb0;
  --south-soft: rgba(58, 95, 176, .18);
  --marchand: #c4121f;
  --marchand-soft: rgba(196, 18, 31, .16);
  --serif: "Cormorant Garamond", "Cormorant", Georgia, serif;
  --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --sans: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Archivo", "Arial Black", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
/* Espaço da barra de rolagem sempre reservado: se ela aparece/some, a largura não muda e o 3D não é redimensionado (era o que piscava). */
html { scrollbar-gutter: stable; }
body { margin: 0; background: var(--bg); color: var(--white); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

.app { display: grid; grid-template-rows: auto 1fr; min-height: 100%; padding-inline: 16px; overflow-x: clip; } /* painel recolhido fica fora da tela à direita: sem barra horizontal */

/* Topo */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 22px; margin-right: auto; min-width: 0; }
.lockup { display: flex; align-items: center; gap: 18px; }
.lockup a { display: block; }
.lockup img { display: block; width: auto; }
.lockup .south { height: 46px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } /* título só para leitores de tela */
.car-switch { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--band); border-radius: 12px; padding: 7px 12px 7px 14px; cursor: pointer; text-align: left; min-height: 44px; transition: border-color .2s; }
.car-switch:hover { border-color: rgba(244,246,249,.3); }
.car-switch small { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; }
.car-switch strong { display: block; font: 600 17px/1.2 var(--cond); }
.car-switch svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.mode { position: relative; display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.03); }
.mode-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0; border-radius: 999px; background: var(--white); transition: transform .55s cubic-bezier(.65, 0, .35, 1), width .55s cubic-bezier(.65, 0, .35, 1); }
.mode button { position: relative; z-index: 1; border: 0; background: none; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--muted); min-height: 40px; transition: color .35s; }
.mode button[aria-pressed="true"] { color: #000; font-weight: 500; }

/* Garagem (seletor de carros) */
.garage { width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line); border-radius: 20px; background: #070b16; color: var(--white); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.garage::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(4px); }
.garage[open] { animation: garage-in .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes garage-in { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.garage-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px; }
.garage-head h2 { margin: 0; font: 800 18px/1 var(--display); font-stretch: 125%; letter-spacing: .05em; text-transform: uppercase; }
.garage-close { border: 0; background: none; color: var(--muted); cursor: pointer; width: 40px; height: 40px; border-radius: 50%; font-size: 22px; line-height: 1; }
.garage-close:hover { color: var(--white); background: rgba(255,255,255,.06); }
.garage-list { list-style: none; margin: 0; padding: 4px 12px; display: grid; gap: 6px; }
.garage-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: stretch; }
.row-actions { display: flex; flex-direction: column; gap: 6px; }
.icon-btn { flex: 1; width: 40px; min-height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--muted); cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.icon-btn:hover:not(:disabled) { color: var(--white); border-color: rgba(244,246,249,.3); }
.icon-btn.del:hover:not(:disabled) { color: #ff8a92; border-color: rgba(196,18,31,.6); background: var(--marchand-soft); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.confirm-del { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 14px; border: 1px solid rgba(196,18,31,.55); border-radius: 14px; background: var(--marchand-soft); }
.confirm-del span { flex: 1; min-width: 160px; font-size: 14px; }
.confirm-del button { border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 500; min-height: 36px; }
.confirm-del .keep { border: 1px solid var(--line); background: none; }
.confirm-del .really { border: 0; background: var(--marchand); color: #fff; }
.form-title { grid-column: 1 / -1; margin: 0; font: 600 16px var(--cond); }
.garage-car { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: none; cursor: pointer; text-align: left; transition: border-color .2s, background .2s; }
.garage-car:hover { background: rgba(255,255,255,.03); }
.garage-car[aria-current="true"] { border-color: var(--south); background: var(--south-soft); }
.garage-car strong { font: 600 18px/1.2 var(--cond); }
.garage-car span { color: var(--muted); font-size: 13px; }
.garage-car em { grid-row: span 2; font-style: normal; font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.garage-car em.ok { color: var(--white); border-color: var(--south); }
.garage-add { margin: 10px 12px 16px; display: grid; gap: 10px; }
.garage-add > button { border: 1px dashed rgba(244,246,249,.25); background: none; border-radius: 14px; padding: 13px; cursor: pointer; font-weight: 500; }
.garage-add > button:hover { border-color: var(--white); }
.add-form { display: grid; grid-template-columns: 1fr 1fr 90px; gap: 8px; }
.add-form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.add-form input, .add-form select { width: 100%; background: #0d1220; color: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: 15px var(--sans); }
.add-form .row { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }
.add-form .row button { border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 500; }
.add-form .save { border: 0; background: var(--white); color: #000; }
.add-form .cancel { border: 1px solid var(--line); background: none; }
.add-color { grid-column: 1 / -1; margin: 0; padding: 0; border: 0; min-width: 0; }
.add-color legend { padding: 0; font-size: 12px; color: var(--muted); }
.add-color .swatches { margin-top: 6px; gap: 8px; }
.add-color .sw i { width: 32px; height: 32px; }
.add-color .sw-caption { margin-top: 6px; }
.sw-custom i { background: conic-gradient(#e33, #ec3, #3c5, #3ae, #73e, #e33); }
.sw-custom input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sw-custom.is-on i { border-color: var(--white); box-shadow: 0 0 0 3px #000, 0 0 0 5px var(--white); }
.list-crest { height: 22px; width: auto; margin-right: 10px; vertical-align: -5px; }
.chip-crest { height: 30px; width: auto; flex: none; }
.car-dot { display: inline-block; width: 12px; height: 12px; margin-right: 8px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); vertical-align: 1px; }
.no-3d { position: absolute; left: 22px; top: 70px; max-width: 300px; margin: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(6,8,14,.85); color: var(--muted); font-size: 13px; }

/* Palco */
.stage { position: relative; padding-block: 16px; min-height: 0; }
.viewport { position: relative; height: calc(100vh - 116px); min-height: 520px; border-radius: 22px; overflow: hidden;
  background: radial-gradient(60% 55% at 50% 58%, #13254a 0%, #070b16 55%, #000 100%); }
.viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.viewport canvas:active { cursor: grabbing; }
.stage-caption { position: absolute; left: 22px; top: 18px; max-width: min(70%, 560px); pointer-events: none; transition: opacity .4s; }
.viewport.is-focused .stage-caption { opacity: 0; }
.stage-caption h2 { margin: 0; display: flex; align-items: center; gap: 12px; font: 500 clamp(22px, 2.4vw, 32px)/1.1 var(--serif); text-wrap: balance; }
.brand-crest { height: 1.3em; width: auto; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); transition: opacity .4s; }
.car-controls { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid var(--line); background: rgba(6,8,14,.8); }
.car-controls button { display: flex; align-items: center; gap: 8px; border: 0; background: none; border-radius: 999px; padding: 8px 14px; min-height: 40px; cursor: pointer; color: var(--muted); font-size: 13px; transition: background .3s, color .3s; }
.car-controls button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.car-controls button[aria-pressed="true"] { background: var(--white); color: #000; }
.car-controls button:hover:not([aria-pressed="true"]) { color: var(--white); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: var(--muted); font: 500 17px var(--cond); pointer-events: none; }
.drag-hint { position: absolute; left: 22px; bottom: 20px; color: var(--muted); font-size: 13px; pointer-events: none; }

/* Pontos clicáveis */
#spots { position: absolute; inset: 0; pointer-events: none; }
.spot { position: absolute; left: 0; top: 0; will-change: transform; display: flex; align-items: center; gap: 8px; pointer-events: auto; border: 0; background: none; padding: 6px; cursor: pointer; transition: opacity .4s ease; --c: var(--south); }
.spot[data-layer="marchand"] { --c: var(--marchand); }
.spot .dot { position: relative; width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px rgba(255,255,255,.9); flex: none;
  transition: transform .45s cubic-bezier(.34, 1.4, .64, 1), background-color .3s, box-shadow .3s; }
.spot .dot { transition-delay: inherit; } /* bolinha cresce junto com o atraso escalonado da troca de aba */
.spot .dot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--c); animation: pulse 2.2s ease-out infinite; }
.spot .tag { font: 500 15px/1 var(--cond); background: rgba(6,8,14,.82); border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px; white-space: nowrap;
  /* nome escondido: aparece deslizando quando passa o mouse, foca pelo teclado ou o ponto está ativo */
  opacity: 0; transform: translateX(-6px); clip-path: inset(0 100% 0 0 round 999px); pointer-events: none;
  transition: opacity .25s ease, transform .35s cubic-bezier(.2, .8, .2, 1), clip-path .35s cubic-bezier(.2, .8, .2, 1); }
.spot:hover .tag, .spot:focus-visible .tag, .spot.is-active .tag { opacity: 1; transform: none; clip-path: inset(0 0 0 0 round 999px); }
.spot.is-active .dot { box-shadow: 0 0 0 3px var(--white), 0 0 0 9px var(--c); }
/* Fora da aba atual ou atrás do carro: some encolhendo (e volta crescendo com um leve "pulo") */
.spot.is-away, .spot.is-off { opacity: 0; pointer-events: none; }
.spot.is-away .dot, .spot.is-off .dot { transform: scale(.3); transition-timing-function: ease-in; }
.spot.is-off .tag, .spot.is-away .tag { opacity: 0; }
.spot[hidden] { display: none; }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }

/* Painel */
.panel { position: absolute; top: 28px; right: 12px; bottom: 28px; width: 400px; display: flex; flex-direction: column; min-height: 0;
  background: rgba(9,12,20,.95); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: -20px 0 60px rgba(0,0,0,.45);
  transition: transform .55s cubic-bezier(.22, 1, .36, 1), opacity .4s ease, visibility 0s;
  will-change: transform; contain: layout paint; } /* camada própria e layout isolado: redesenhar o painel não mexe no resto da página */
/* Interface recolhida: só o carro e os dois botões */
.app.is-collapsed .panel { transform: translateX(calc(100% + 24px)); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform .45s cubic-bezier(.55, 0, .75, .2), opacity .35s ease, visibility 0s .45s; }
.chooser { position: absolute; top: 28px; right: 28px; display: grid; gap: 10px; width: 260px; z-index: 2;
  transition: transform .5s cubic-bezier(.22, 1, .36, 1), opacity .35s ease; }
.app:not(.is-collapsed) .chooser { transform: translateX(30px); opacity: 0; pointer-events: none; }
.chooser button { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; text-align: left; padding: 16px 18px; border-radius: 16px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(6,8,14,.82); color: var(--white); transition: border-color .25s, background .25s, transform .25s; }
.chooser button:hover { transform: translateX(-3px); }
.chooser button[data-layer="marchand"]:hover { border-color: var(--marchand); background: rgba(40,8,12,.85); }
.chooser button[data-layer="south"]:hover { border-color: var(--south); background: rgba(10,20,44,.85); }
.chooser strong { font: 800 15px/1.2 var(--display); font-stretch: 125%; letter-spacing: .07em; text-transform: uppercase; }
.chooser span { grid-column: 1; color: var(--muted); font: 500 14px/1.3 var(--cond); }
.chooser .pick { grid-row: span 2; grid-column: 2; height: 26px; width: 40px; object-fit: contain; }
.chooser .count { font: 600 12px var(--cond); color: var(--white); }
.panel-close { position: absolute; z-index: 2; top: 10px; right: 10px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,255,255,.06); color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
.panel-close:hover { color: var(--white); background: rgba(255,255,255,.12); }
.layers { position: relative; display: grid; grid-template-columns: 1fr 1fr 52px; border-bottom: 1px solid var(--line); }
.layer-thumb { position: absolute; left: 0; top: 0; bottom: -1px; width: calc(50% - 26px); background: var(--marchand-soft); border-bottom: 2px solid var(--marchand); pointer-events: none;
  transition: transform .5s cubic-bezier(.65, 0, .35, 1), background-color .5s, border-color .5s; }
.layers[data-active="south"] .layer-thumb { transform: translateX(100%); background: var(--south-soft); border-color: var(--south); }
.layers button { position: relative; z-index: 1; border: 0; background: none; padding: 14px 18px; text-align: left; cursor: pointer; color: var(--muted); min-height: 64px; transition: color .35s; }
.layers button strong { display: block; margin-bottom: 4px; font: 800 15px/1.2 var(--display); font-stretch: 125%; letter-spacing: .07em; text-transform: uppercase; color: inherit; }
.layers button span { font: 500 14px/1.3 var(--cond); }
.layers button[aria-selected="true"] { color: var(--white); }

.groups { overflow-y: auto; padding: 6px 0; flex: 1; overscroll-behavior: contain; }
.group { padding: 14px 20px; border-left: 2px solid transparent; transition: background .3s, border-color .3s; }
.group.is-active { background: rgba(255,255,255,.035); border-left-color: var(--c, var(--south)); }
.group[data-layer="marchand"] { --c: var(--marchand); }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.badge { margin-left: 8px; font: 500 9px/1 var(--sans); font-stretch: normal; letter-spacing: .02em; text-transform: none; color: var(--muted); vertical-align: baseline; } /* mesma linha de base do título */
.qty { grid-column: 2 / 4; display: inline-flex; align-items: center; gap: 2px; justify-self: start; margin-top: 6px; border: 1px solid var(--line); border-radius: 999px; }
.qty button { width: 34px; height: 30px; border: 0; background: none; border-radius: 999px; cursor: pointer; font-size: 17px; color: var(--white); }
.qty button:hover:not(:disabled) { background: rgba(255,255,255,.07); }
.qty button:disabled { opacity: .3; cursor: default; }
.qty output { min-width: 64px; text-align: center; font: 600 14px var(--cond); font-variant-numeric: tabular-nums; }
.group-head h3 { margin: 0; font: 800 15px/1.2 var(--display); font-stretch: 125%; letter-spacing: .07em; text-transform: uppercase; } /* mesma família do título GARAGEM SOUTH */
.group-head .group-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 500 14px var(--cond); white-space: nowrap; }
.group-head .chev { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
.group.is-open .group-head .chev { transform: rotate(180deg); }
.group-head:hover .group-meta { color: var(--white); }
/* Sanfona: altura anima de 0 até o conteúdo */
.group-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.22, 1, .36, 1); }
.group.is-open .group-body { grid-template-rows: 1fr; }
/* conteúdo aparece em fade enquanto abre; ao fechar some rápido */
.group-inner > * { opacity: 0; transform: translateY(-6px); transition: opacity .2s ease, transform .2s ease; }
.group.is-open .group-inner > * { opacity: 1; transform: none; transition: opacity .45s ease .12s, transform .5s cubic-bezier(.22, 1, .36, 1) .12s; }
.group-inner { min-height: 0; overflow: hidden; padding-inline: 8px; margin-inline: -8px; } /* folga lateral: anel da cor escolhida e foco não são cortados */
.group-note { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.group-note.warn { color: #e9b7bb; }
.opts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 12px; }
.opt { position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: border-color .2s, background .2s; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .box { width: 18px; height: 18px; margin-top: 2px; border: 1.5px solid var(--muted); border-radius: 5px; display: grid; place-items: center; }
.opt input[type="radio"] + .box { border-radius: 50%; }
.opt input:checked + .box { border-color: var(--c, var(--south)); background: var(--c, var(--south)); }
.opt input:checked + .box::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.opt input:focus-visible + .box { outline: 2px solid var(--white); outline-offset: 2px; }
.opt:has(input:checked) { border-color: color-mix(in srgb, var(--c, var(--south)) 70%, transparent); background: rgba(255,255,255,.03); }
.opt .name { font-weight: 500; }
.opt .price { font: 600 16px/1.3 var(--cond); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.opt.tier { padding: 14px 14px 13px; border-radius: 14px; align-items: center; background: linear-gradient(180deg, rgba(255,255,255,.03), transparent); }
.opt.tier:hover { border-color: rgba(244,246,249,.22); }
.opt.tier:has(input:checked) { border-color: var(--c, var(--south)); background: color-mix(in srgb, var(--c, var(--south)) 16%, transparent); box-shadow: inset 0 0 0 1px var(--c, var(--south)); }
.tier-head { min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
.tier-name { font: 800 12px/1.2 var(--display); font-stretch: 112%; letter-spacing: .06em; text-transform: uppercase; }
.tier-bars { display: inline-flex; gap: 3px; }
.tier-bars i { width: 14px; height: 4px; border-radius: 2px; background: rgba(244,246,249,.16); }
.tier-bars i.on { background: var(--c, var(--south)); }
.tier-badge { font: 600 10px/1 var(--sans); color: #fff; background: var(--c, var(--south)); padding: 4px 8px; border-radius: 999px; }
.opt.tier .price { font-size: 20px; }
.opt.tier .detail { margin-top: 2px; }
.opt.tier .incl { display: none; padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--line); }
.opt.tier:has(input:checked) .incl { display: grid; }
.incl { grid-column: 2 / 4; list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; }
.incl li { position: relative; padding-left: 14px; color: var(--muted); font-size: 12px; line-height: 1.35; }
.incl li::before { content: "✓"; position: absolute; left: 0; color: var(--c, var(--south)); font-size: 11px; }
@media (max-width: 560px) { .incl { grid-template-columns: 1fr; } }

function stepZoom(t) {

function carbonWeave() {
  const N = 16, C = 32, c = document.createElement('canvas'); c.width = c.height = N * C;
  const x = c.getContext('2d');
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const horiz = ((i + j) >> 1) % 2 === 0; // twill: muda a cada 2 células na diagonal
    const x0 = i * C, y0 = j * C;
    const g = horiz ? x.createLinearGradient(x0, y0, x0, y0 + C) : x.createLinearGradient(x0, y0, x0 + C, y0);
    g.addColorStop(0, '#0c0d0f'); g.addColorStop(0.5, horiz ? '#4a4f57' : '#3a3e45'); g.addColorStop(1, '#0c0d0f');

    x.strokeStyle = 'rgba(255,255,255,0.05)'; x.lineWidth = 1; // fibras finas
    for (let k = 4; k < C; k += 5) { x.beginPath(); horiz ? (x.moveTo(x0, y0 + k), x.lineTo(x0 + C, y0 + k)) : (x.moveTo(x0 + k, y0), x.lineTo(x0 + k, y0 + C)); x.stroke(); }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;

varying vec3 vWPos; varying vec3 vWNrm;`)

vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz; vWNrm = normalize(mat3(modelMatrix) * objectNormal);`);

      .replace('#include <common>', `#include <common>
varying vec3 vWPos; varying vec3 vWNrm; uniform float weaveScale;`)
      .replace('#include <map_fragment>', `vec3 bw = pow(abs(normalize(vWNrm)), vec3(4.0)); bw /= (bw.x + bw.y + bw.z);

};

// UV por projeção no eixo dominante da normal de cada vértice: a trama do carbono fica em escala real e não estica.
function projectUV(o) {
  const uv = [], p = o.geometry.attributes.position, nrm = o.geometry.attributes.normal, v = new THREE.Vector3(), n = new THREE.Vector3();
  const nm = new THREE.Matrix3().getNormalMatrix(o.matrixWorld);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld); n.fromBufferAttribute(nrm, i).applyMatrix3(nm);
    const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
    if (ax >= ay && ax >= az) uv.push(v.z * 6, v.y * 6); else if (ay >= az) uv.push(v.x * 6, v.z * 6); else uv.push(v.x * 6, v.y * 6);
  }
  o.geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
}
// Separa os triângulos de uma malha em grupos de material, pela posição do centro de cada triângulo.
function splitByRegion(mesh, classify, materials) {
  const g = mesh.geometry, pos = g.attributes.position;
  const idx = g.index ? Array.from(g.index.array) : [...Array(pos.count).keys()];
  const buckets = materials.map(() => []);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < idx.length; i += 3) {
    a.fromBufferAttribute(pos, idx[i]); b.fromBufferAttribute(pos, idx[i + 1]); c.fromBufferAttribute(pos, idx[i + 2]);
    const m = a.add(b).add(c).divideScalar(3).applyMatrix4(mesh.matrixWorld);
    buckets[classify(m)].push(idx[i], idx[i + 1], idx[i + 2]);
  }
  g.setIndex(buckets.flat());
  g.clearGroups();
  let start = 0;
  buckets.forEach((bk, i) => { g.addGroup(start, bk.length, i); start += bk.length; });
  mesh.material = materials;
}

const viewShift = { x: 0 }; // px que o carro anda para a esquerda quando o painel está aberto

// Câmera orbita em arco ao redor do carro (interpola distância, altura e ângulo), em vez de ir em linha reta.
let flight = null;
function fly({ pos, target }) {
  controls.autoRotate = false;
  zoom.d = null; // voo da câmera manda: cancela o zoom em andamento
  const t0 = controls.target.clone(), t1 = new THREE.Vector3(...target);
  if (reduced) { camera.position.set(...pos); controls.target.copy(t1); return; }
  const s0 = new THREE.Spherical().setFromVector3(camera.position.clone().sub(t0));
  const s1 = new THREE.Spherical().setFromVector3(new THREE.Vector3(...pos).sub(t1));
  const dTheta = Math.atan2(Math.sin(s1.theta - s0.theta), Math.cos(s1.theta - s0.theta)); // pelo lado mais curto
  const turn = Math.abs(dTheta) / Math.PI; // giros maiores levam um pouco mais de tempo
  const sp = new THREE.Spherical(), p = { k: 0 };
  if (flight) flight.kill();
  flight = gsap.to(p, { k: 1, duration: 1.3 + turn * 0.7, ease: 'power2.inOut', onUpdate: () => {
    const k = p.k;
    controls.target.lerpVectors(t0, t1, k);
    sp.set(s0.radius + (s1.radius - s0.radius) * k, s0.phi + (s1.phi - s0.phi) * k, s0.theta + dTheta * k);
    camera.position.setFromSpherical(sp).add(controls.target);
  } });
}

// Troca de cor suave: 1,2s com aceleração e frenagem; uma troca nova substitui a anterior (sem "briga"),

const glint = { v: 0 }; // brilho extra que passa pela lataria durante a troca de cor da pintura

const FILMS = { 'film-carbono': [0.86, 0], 'film-ceramica': [0.7, 0], 'film-refletiva': [0.78, 0.75], 'film-seguranca': [0.58, 0] };

function applyVisuals() {
  const film = Object.keys(FILMS).find(id => state.checks.has(id));
  [glassMat.opacity, glassMat.metalness] = film ? FILMS[film] : [0.5, 0];
  const smoke = Object.keys(SMOKE).find(id => state.checks.has(id));

const groupsEl = document.getElementById('groups');

/* ---------- Orçamento ---------- */
function lineItems() {

    let picks = [];

    else if (g.kind === 'radio') picks = g.options.filter(o => o.id === state.radio[g.id] && o.price);
    else {
      const it = swatchItem(g, g.items.find(i => i.id === state.radio[g.id]));
      if (it.id !== 'original') picks = [{ name: `${g.title()}: ${it.label}`, price: it.price, onde: g.onde }];
    }
    for (const o of picks) {
      const name = g.kind === 'radio' || g.id === 'revisao' ? `${g.title()}, ${o.name}` : o.name;
      if (offInCasa(o)) { skipped.push(name); continue; }
      const n = qtyOf(o);
      const p = o.price === null ? null : (o.price + (state.mode === 'complexo' && o.inst ? o.inst : 0)) * n;
      const label = o.lineName || (g.linePrefix ? `${g.linePrefix} ${o.name.charAt(0).toLowerCase()}${o.name.slice(1)}` : g.id === 'reparo' ? `Reparo ${o.name.toLowerCase()}` : name);
      lines.push({ id: o.id || `${g.id}-${state.radio[g.id]}`, name: n > 1 ? `${label} × ${n}` : label, p, brand });
    }

}
const totalEl = document.getElementById('total'), totalShown = { v: 0 };

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
// Devolve 'car' (carro do pódio), o id de um carro do showroom, ou null.
// Testa a caixa de cada carro (não os ~100 mil triângulos de cada um): passar o mouse no 3D fica leve.
const carBox = new THREE.Box3(), pickBox = new THREE.Box3(), hitP = new THREE.Vector3();
function pick(e) {
  if (showroom.busy || !showroom.ready) return null;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  let best = null, bestD = Infinity;
  for (const [id, pod] of showroom.pods) {
    if (!pod.visible) continue;
    pickBox.copy(carBox).applyMatrix4(pod.matrixWorld);
    if (!ray.ray.intersectBox(pickBox, hitP)) continue;
    const d = hitP.distanceToSquared(ray.ray.origin);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best === null ? null : best === state.carId ? 'car' : best;
}

canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || performance.now() - down.t > 400) return;
  const hit = pick(e);
  if (hit === 'car') openGarage(); else if (hit) selectCar(hit);
});

canvas.addEventListener('pointermove', e => {

  hoverEv = e;

/* ---------- Showroom: cada carro da garagem na sua plataforma ---------- */
// As plataformas ficam num círculo; o carro escolhido fica na frente da câmera e os outros aparecem lá no fundo,
// desfocados. Trocar de carro leva a câmera em voo pela borda do círculo até a plataforma dele.
// (Na prática quem gira é a sala inteira em volta da câmera: tudo que já está ancorado no pódio — bolinhas,
// vistas dos serviços, faróis — continua valendo sem mudança.)
const FOG_SHOWROOM = { near: 16, far: 60 }, FOG_FOCUS = { near: 15, far: 24 }; // focado: só o pódio do carro fica visível
scene.fog = new THREE.Fog(0x0a1224, FOG_SHOWROOM.near, FOG_SHOWROOM.far);
// Com o painel aberto os outros carros somem na névoa; quando a névoa fecha, eles deixam de ser desenhados e o
// desfoque (que só servia pra eles) é desligado: configurar o carro fica mais leve.
function setFocusFog(on) {
  const f = on ? FOG_FOCUS : FOG_SHOWROOM;
  showroom.focused = on;
  if (!on) { showOthers(true); bokeh.enabled = true; }
  const done = () => { if (showroom.focused && !showroom.busy) { showOthers(false); bokeh.enabled = false; } invalidate(); };
  if (reduced) { Object.assign(scene.fog, f); done(); }
  else gsap.to(scene.fog, { ...f, duration: 1.2, ease: 'power2.inOut', overwrite: true, onComplete: done });
}
function showOthers(on) { for (const [id, pod] of showroom.pods) pod.visible = on || id === state.carId; }
const room = new THREE.Group();
scene.add(room);
const showroom = { ready: false, pods: new Map(), busy: null, beams: null, focused: false }; // beams: grupo dos fachos, vai na plataforma do carro escolhido
const HOME_AZ = Math.atan2(HOME.pos[0] - HOME.target[0], HOME.pos[2] - HOME.target[2]);
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const podR = () => Math.max(16, garage.length * 2.4); // raio do círculo: plataformas não encostam umas nas outras
// Com 2 carros o outro fica de lado (não escondido bem atrás do escolhido).
const podAngle = id => garage.findIndex(c => c.id === id) * 2 * Math.PI / Math.max(garage.length, 3);
// Gira/move a sala para a plataforma no ângulo theta ficar na origem, na mesma posição de sempre.
function setRoom(theta) {
  const phi = theta - HOME_AZ, r = podR();
  room.rotation.y = -phi;
  room.position.set(-r * Math.sin(theta), 0, -r * Math.cos(theta)).applyAxisAngle(THREE.Object3D.DEFAULT_UP, -phi);
  shadowDirty = true; invalidate(); // sombra só é recalculada quando a sala se move
}
function makeGhost(c) {
  const p = paint.clone(); p.color.set(c.cor.hex);
  const swap = m => (m === paint ? p : m === carbon ? trim : m);
  const g = car.clone();
  g.traverse(o => { if (o.isMesh) o.material = Array.isArray(o.material) ? o.material.map(swap) : swap(o.material); });
  g.userData = { ghostOf: c.id, paint: p };
  return g;
}
// Monta uma plataforma por carro: o escolhido recebe o carro de verdade, os outros uma cópia na cor deles.
function syncShowroom() {
  if (!showroom.ready) return;
  for (const pod of showroom.pods.values()) {
    for (const o of pod.children) if (o.userData.ghostOf) o.userData.paint.dispose();
    room.remove(pod);
  }
  showroom.pods.clear();
  const r = podR();
  for (const c of garage) {
    const a = podAngle(c.id), pod = new THREE.Group();
    pod.position.set(r * Math.sin(a), 0, r * Math.cos(a));
    pod.rotation.y = a - HOME_AZ;
    pod.add(podium.clone(), c.id === state.carId ? car : makeGhost(c));
    if (c.id === state.carId && showroom.beams) pod.add(showroom.beams);
    room.add(pod);
    showroom.pods.set(c.id, pod);
  }
  setRoom(podAngle(state.carId));

// Voo da câmera: afasta e sobe no meio do caminho, contorna o círculo e pousa na plataforma escolhida.
function showroomSwap(prev, next) {
  if (!showroom.ready) return;
  if (showroom.busy) showroom.busy.progress(1); // troca rápida: termina a anterior na hora
  syncShowroom(); // já na arrumação final (carro de verdade na plataforma nova)
  // O carro de destino já está na cor dele lá longe (sem transição de cor durante o voo).
  gsap.killTweensOf(paint.color); paint.color.set(next.cor.hex); paint.userData.colorTarget = paint.color.getHex();
  if (reduced) return;
  if (flight) flight.kill();
  zoom.d = null;
  const t0 = podAngle(prev.id), t1 = t0 + wrap(podAngle(next.id) - t0);
  const off = camera.position.clone().sub(controls.target), maxD = controls.maxDistance;
  controls.enabled = false; controls.autoRotate = false; controls.maxDistance = 40;
  const k = { v: 0 };
  setRoom(t0);

  showroom.busy = gsap.to(k, { v: 1, duration: 2.4, ease: 'power2.inOut',
    onUpdate: () => {
      setRoom(t0 + (t1 - t0) * k.v);
      const lift = Math.sin(Math.PI * k.v);
      camera.position.copy(controls.target).addScaledVector(off, 1 + 0.8 * lift);
      camera.position.y += 2.2 * lift;
    },
    onComplete: () => {
      camera.position.copy(controls.target).add(off);
      controls.maxDistance = maxD; controls.enabled = true;
      showroom.busy = null;
      if (showroom.focused) showOthers(false);
    } });
}

/* ---------- Abertura + loop ---------- */
renderGroups(); selectCar(state.carId); moveThumb();
// Qualquer animação GSAP rodando (câmera, cores, névoa, faróis) também pede quadro novo.
const animating = () => gsap.globalTimeline.getChildren(false, true, false).length > 0;
// Qualidade adaptativa: mede os primeiros quadros; se a máquina não segura ~45 fps, desenha em resolução 1x.
const perf = { last: 0, dts: [] };
function measure() {
  const now = performance.now(), dt = now - perf.last;
  perf.last = now;
  if (perf.dts.length >= 90 || dt > 100) return; // pausas (aba parada, sem animação) não contam
  perf.dts.push(dt);
  if (perf.dts.length < 90) return;
  const median = perf.dts.sort((a, b) => a - b)[45];
  if (median > 22 && renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); composer.setPixelRatio(1); resize(); }
}
renderer.setAnimationLoop(t => {
  const zoomed = stepZoom(t);
  const moved = controls.update() || zoomed;
  if (!moved && frames <= 0 && !animating()) return; // nada mudou: não redesenha
  frames = Math.max(0, frames - 1);
  bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target);
  if (shadowDirty) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  composer.render();
  if (!spotsEl.hidden) placeSpots();
  if (showroom.ready) measure();
});
await loadCar.catch(err => {
  console.error(err);
  document.getElementById('loading').textContent = 'Não foi possível carregar o modelo 3D. Recarregue a página.';
  throw err;
});
spotsEl.hidden = false;
applyVisuals();
showroom.ready = true;
scene.remove(podium);
syncShowroom();
room.updateMatrixWorld(true);
// Caixa de clique = lataria (as cópias do emblema nas rodas carregam a geometria inteira e inflariam a caixa), até o chão.
// Sala em repouso: plataforma do carro = origem, então a caixa vale pra todas as plataformas.
car.traverse(o => { if (o.material === paintSlots) carBox.setFromObject(o); });
carBox.min.y = 0;
// Faróis: acende faróis/lanternas e projeta dois fachos no pódio.
const beams = [1, -1].map(side => {
  const b = new THREE.SpotLight(0xeaf2ff, 0, 5, 0.4, 0.95, 1.6); // facho cai dentro do pódio
  b.position.set(2.25, 0.74, side * 0.62);
  b.target.position.set(4.2, -0.6, side * 0.8);
  return b;
});
showroom.beams = new THREE.Group();
showroom.beams.add(...beams, ...beams.map(b => b.target));
showroom.pods.get(state.carId).add(showroom.beams);
const lightsBtn = document.getElementById('ctl-lights');
function setLights(on, delay = 0) {
  lightsBtn.setAttribute('aria-pressed', on);
  const t = { duration: reduced ? 0 : 0.45, delay: reduced ? 0 : delay, overwrite: true };
  gsap.to(headMat, { emissiveIntensity: on ? 8 : 0, ...t });
  gsap.to(tailMat, { emissiveIntensity: on ? 5 : 0, ...t });
  gsap.to(tailLensMat, { emissiveIntensity: on ? 1.4 : 0, ...t });
  gsap.to(tailChrome, { emissiveIntensity: on ? 0.8 : 0, ...t });
  for (const b of beams) gsap.to(b, { intensity: on ? 55 : 0, ...t });
}
lightsBtn.addEventListener('click', () => setLights(lightsBtn.getAttribute('aria-pressed') !== 'true'));

// Pré-compila os shaders de tudo que pode aparecer depois (carbono nas peças) com um quadro de aquecimento escondido
// embaixo do pódio: a primeira escolha de carbono não engasga. O "Carregando" só sai depois disso.
{
  const warm = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.01, 0.01), carbon);
  warm.position.y = -2; warm.frustumCulled = false;
  scene.add(warm);
  renderer.shadowMap.needsUpdate = true;
  composer.render();
  scene.remove(warm); warm.geometry.dispose();
  invalidate();
}
document.getElementById('loading').remove();

if (reduced) setLights(true);
else {
  camera.position.set(-7.5, 1.4, 4.5);
  gsap.to(camera.position, { x: HOME.pos[0], y: HOME.pos[1], z: HOME.pos[2], duration: 2.6, ease: 'power3.out' });
  setLights(true, 1.3);
}
</script>
